name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in the root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (svelte-kit sync + svelte-check)
        run: pnpm -C svelte-draw-app run check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # enable once the lint config lands
      # - name: Lint
      #   run: pnpm lint

      # enable once the format config lands
      # - name: Format check
      #   run: pnpm format:check
