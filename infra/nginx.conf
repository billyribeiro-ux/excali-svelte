# nginx server block for the static svelte-draw build (svelte-draw-app/build).
# Installed by the Dockerfile as /etc/nginx/conf.d/default.conf.
#
# nginx does not inherit `add_header` into a location that sets its own
# `add_header`, so the security headers are repeated in each such location.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "origin" always;

  # Hashed build output (fonts, chunks, CSS): content-addressed, cache for a year.
  location /_app/immutable/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "origin" always;
    try_files $uri =404;
  }

  # Entry document, version marker and service worker (if the build emits one):
  # always revalidate so a new deployment is picked up.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "origin" always;
  }
  location = /_app/version.json {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "origin" always;
  }
  location = /service-worker.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "origin" always;
    try_files $uri =404;
  }

  # SPA-safe fallback: unknown paths get the app shell (the app is a client-side
  # editor and routes through the URL hash / a single route).
  location / {
    try_files $uri /index.html;
  }
}
